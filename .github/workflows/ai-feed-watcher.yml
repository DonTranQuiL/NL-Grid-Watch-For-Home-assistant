name: AI Starter Feed Watcher

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  schema-audit:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        if: hashFiles('ai_engineer/feed_watcher.py') != ''
        run: pip install requests openai

      - name: Run Starter Feed Watcher
        if: hashFiles('ai_engineer/feed_watcher.py') != ''
        id: watcher
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python ai_engineer/feed_watcher.py

      - name: Skip when ai_engineer/feed_watcher.py absent
        if: hashFiles('ai_engineer/feed_watcher.py') == ''
        run: echo "ai_engineer/feed_watcher.py not present; skipping watcher"

      - name: Create Issue
        if: env.SCHEMA_CHANGED == 'true'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: ${{ env.ISSUE_TITLE }}
          content-filepath: ./feed_watch_report.md
          labels: bug, upstream-change, ai-detected

      - name: Save API Memory Snapshots
        if: hashFiles('ai_engineer/feed_watcher.py') != ''
        run: |
          git config --global user.name "AI Staff Engineer"
          git config --global user.email "ai@github.com"
          git add .memory/
          git commit -m "chore: update starter_feed API baseline" || echo "Memory is already up to date"
          git push
